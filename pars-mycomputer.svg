<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arka plan gradyanı -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Küp içindeki enerji akışı/girdap gradyanı -->
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Küp yüzeyleri için gradyanlar -->
    <linearGradient id="topFace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Parlama efekti -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="64"/>

  <!-- Dış Ağ / Bağlantı Halkası (Node Network) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <circle cx="256" cy="256" r="180" stroke-dasharray="4 8"/>
    <path d="M256 64 L346 96 L416 166 L448 256 L416 346 L346 416 L256 448 L166 416 L96 346 L64 256 L96 166 L166 96 Z"/>
    <path d="M256 64 L310 120 L256 180 L200 120 Z"/>
    <path d="M448 256 L380 280 L346 210 L416 166 Z"/>
    <path d="M256 448 L210 380 L280 346 L310 416 Z"/>
    <path d="M64 256 L130 230 L166 302 L96 346 Z"/>
  </g>

  <!-- Ağ Düğümleri (Nodes) -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="256" cy="64" r="5"/>
    <circle cx="346" cy="96" r="4"/>
    <circle cx="416" cy="166" r="4"/>
    <circle cx="448" cy="256" r="5"/>
    <circle cx="416" cy="346" r="4"/>
    <circle cx="346" cy="416" r="4"/>
    <circle cx="256" cy="448" r="5"/>
    <circle cx="166" cy="416" r="4"/>
    <circle cx="96" cy="346" r="4"/>
    <circle cx="64" cy="256" r="5"/>
    <circle cx="96" cy="166" r="4"/>
    <circle cx="166" cy="96" r="4"/>
  </g>

  <!-- Merkezdeki İzometrik Küp -->
  <g filter="url(#glow)">
    <!-- Sol Yüz -->
    <polygon points="256,256 256,368 160,312 160,200" fill="url(#leftFace)" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Sağ Yüz -->
    <polygon points="256,256 352,200 352,312 256,368" fill="url(#rightFace)" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Üst Yüz -->
    <polygon points="256,144 352,200 256,256 160,200" fill="url(#topFace)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  </g>

  <!-- Küp İçindeki Dijital Girdap / Enerji Çizgileri -->
  <g fill="none" stroke="url(#vortexGrad)" stroke-width="2.5" stroke-linecap="round">
    <path d="M256,200 C290,210 310,230 290,260 C270,290 220,280 210,250 C200,220 230,180 270,170" opacity="0.9"/>
    <path d="M256,220 C275,225 285,235 275,250 C265,265 240,260 235,245 C230,230 245,210 260,205" opacity="0.7"/>
    <!-- Parçacıklar / Dijital Akış Noktaları -->
    <circle cx="270" cy="170" r="3" fill="#ffffff"/>
    <circle cx="210" cy="250" r="2.5" fill="#38bdf8"/>
    <circle cx="290" cy="260" r="2" fill="#2dd4bf"/>
  </g>
</svg>
